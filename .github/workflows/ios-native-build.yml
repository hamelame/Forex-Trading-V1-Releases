name: iOS Native Build Check
on:
  push:
    branches: [native-ios-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build iOS Simulator app
        run: |
          xcodebuild -project ios/ForexTradingV1.xcodeproj -scheme ForexTradingV1 -sdk iphonesimulator -configuration Debug -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Build physical iPhone target (unsigned validation)
        run: |
          xcodebuild -project ios/ForexTradingV1.xcodeproj -scheme ForexTradingV1 -sdk iphoneos -configuration Release -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator test artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/simulator/Build/Products/Debug-iphonesimulator/ForexTradingV1.app ForexTradingV1-Simulator.zip
      - name: Upload simulator test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForexTradingV1-Simulator
          path: ForexTradingV1-Simulator.zip
          retention-days: 7
