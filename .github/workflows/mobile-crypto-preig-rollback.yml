name: Mobile crypto-only pre-IG rollback checks

on:
  push:
    branches:
      - mobile-crypto-only-no-ig-rollback-20261027
  workflow_dispatch:

jobs:
  crypto-paper-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original WSGI dependencies
        run: python -m pip install -r mobile_cloud/requirements.txt
      - name: Verify CRYPTO-only 24/7 and pre-IG no-order safety
        run: python -m unittest discover -s mobile/tests -p 'test_crypto_preig_rollback.py' -v
      - name: Verify durable disk storage
        run: python -m unittest discover -s mobile/tests -p 'test_durable_storage.py' -v
      - name: Verify post-fork worker initialization
        run: python -m unittest discover -s mobile/tests -p 'test_wsgi_worker_init.py' -v
      - name: Verify stable public LIVE feed concurrency
        run: python -m unittest discover -s mobile/tests -p 'test_live_feed_dispatch.py' -v
      - name: Check browser JavaScript
        run: node --check mobile/web/app.js
      - name: Prove no IG bridge imports or endpoints remain
        run: |
          ! grep -E 'mobile[.]ig_|IGDemoAuto|/api/ig-demo' mobile_cloud/app.py
          ! grep -E '/api/ig-demo|igAuto|igDemoTrial' mobile/web/app.js
