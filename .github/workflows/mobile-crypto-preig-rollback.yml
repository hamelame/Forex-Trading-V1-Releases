name: Mobile fresh multi-market PAPER safety checks

on:
  push:
    branches:
      - mobile-crypto-only-no-ig-rollback-20261027
      - mobile-crypto-shadow-diagnostics-20261102
      - mobile-crypto-order-path-audit-20261102
      - mobile-crypto-postfork-autostart-20261102
      - mobile-fresh-multimarket-paper-20261103
  workflow_dispatch:

jobs:
  crypto-paper-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original WSGI dependencies
        run: python -m pip install -r mobile_cloud/requirements.txt
      - name: Verify multi-market sessions and no IG integration
        run: python -m unittest discover -s mobile/tests -p 'test_crypto_preig_rollback.py' -v
      - name: Verify Shadow RSI and read-only diagnostics
        run: python -m unittest discover -s mobile/tests -p 'test_crypto_shadow_diagnostics.py' -v
      - name: Verify true selected BUY/SELL new-candle admission and accurate blocker
        run: python -m unittest discover -s mobile/tests -p 'test_crypto_order_path_audit.py' -v
      - name: Verify fresh multi-market PAPER, delayed quotes and 126-trade legacy isolation
        run: python -m unittest discover -s mobile/tests -p 'test_fresh_multimarket_paper.py' -v
      - name: Verify durable disk storage
        run: python -m unittest discover -s mobile/tests -p 'test_durable_storage.py' -v
      - name: Verify post-fork worker initialization
        run: python -m unittest discover -s mobile/tests -p 'test_wsgi_worker_init.py' -v
      - name: Verify stable public LIVE feed concurrency
        run: python -m unittest discover -s mobile/tests -p 'test_live_feed_dispatch.py' -v
      - name: Check browser JavaScript
        run: node --check mobile/web/app.js
      - name: Prove no IG bridge imports or endpoints remain
        run: |
          ! grep -E 'mobile[.]ig_|IGDemoAuto|/api/ig-demo' mobile_cloud/app.py
          ! grep -E '/api/ig-demo|igAuto|igDemoTrial' mobile/web/app.js
