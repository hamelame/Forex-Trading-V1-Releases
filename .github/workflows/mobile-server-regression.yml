name: Mobile server regression tests
on:
  push:
    branches:
      - mobile-v2926-nonblocking-state-20261009
      - mobile-v2926-paper-trading-test-20261009
      - mobile-v2926-feed-hang-debug-20261009
      - mobile-v2926-postfork-worker-20261009
      - mobile-v2926-247-persistence-prep-20261009
      - mobile-ig-demo-readonly-20261009
      - mobile-ig-demo-diagnostics-20261009
      - mobile-ig-demo-execution-preflight-20261009
      - mobile-ig-demo-null-reroute-fix-20261009
      - mobile-ig-eurusd-discovery-fix-20261009
      - mobile-ig-demo-first-trade-safe-20261009
      - mobile-ig-demo-close-override-fix-20261009
      - mobile-ig-demo-risk-half-percent-20261009
      - mobile-ig-demo-auto-staged-20261009
  workflow_dispatch:
jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WSGI dependencies for post-fork tests
        run: python -m pip install -r mobile_cloud/requirements.txt
      - name: Run mobile bridge and feed tests
        run: python -m unittest discover -s mobile/tests -p 'test_*.py' -v
      - name: Check browser JavaScript syntax
        run: node --check mobile/web/app.js
      - name: Compile modified Python modules
        run: python -m py_compile mobile/server.py mobile_cloud/app.py mobile/ig_demo.py mobile/ig_demo_preflight.py mobile/ig_demo_trial.py mobile/ig_demo_risk.py mobile/ig_demo_auto.py forex_app/live_market.py
